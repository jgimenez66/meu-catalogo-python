<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Sandra Doces Finos</title>
    <style>
        :root { --cor-principal: #5c3a21; --cor-fundo: #f9f6f0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--cor-fundo); color: #333; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { color: var(--cor-principal); text-align: center; margin-top: 0; }
        .campo { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        textarea { resize: vertical; height: 80px; }
        button { width: 100%; padding: 12px; background: var(--cor-principal); color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #4a2e1a; }
        .erro { color: #d9534f; text-align: center; margin-bottom: 15px; font-weight: bold; display: none; }
        #painel-cadastro { display: none; }
        .produto-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
        .btn-deletar { background: #d9534f; width: auto; padding: 5px 10px; font-size: 12px; }
        .btn-deletar:hover { background: #c9302c; }
        #lista-produtos { margin-top: 20px; max-height: 200px; overflow-y: auto; border: 1px solid #eee; border-radius: 6px; }
    </style>
</head>
<body>

<div class="container">
    <!-- TELA DE LOGIN PROTEGIDA -->
    <div id="tela-login">
        <h2>Acesso Administrativo</h2>
        <div id="erro-login" class="erro">Senha incorreta! Tente novamente.</div>
        <div class="campo">
            <label for="senha">Digite a Senha de Acesso:</label>
            <input type="password" id="senha" placeholder="Sua senha secreta">
        </div>
        <button onclick="verificarSenha()">Entrar no Painel</button>
    </div>

    <!-- PAINEL DE CADASTRO (ESCONDIDO ATÉ FAZER LOGIN) -->
    <div id="painel-cadastro">
        <h2>Gerenciar Catálogo</h2>
        <div id="erro-cadastro" class="erro">Preencha todos os campos obrigatórios!</div>
        
        <form id="form-produto" onsubmit="salvarProduto(event)">
            <div class="campo">
                <label for="nome">Nome do Doce/Produto:</label>
                <input type="text" id="nome" required placeholder="Ex: Brigadeiro Belga Gourmet">
            </div>
            <div class="campo">
                <label for="descricao">Descrição Completa:</label>
                <textarea id="descricao" required placeholder="Ex: Chocolate 50% cacau com granulado belga..."></textarea>
            </div>
            <div class="campo" style="display: flex; gap: 10px;">
                <div style="flex: 1;">
                    <label for="preco">Preço (R$):</label>
                    <input type="text" id="preco" required placeholder="Ex: 5,50">
                </div>
                <div style="flex: 1;">
                    <label for="precoPromocional">Preço Promo (R$):</label>
                    <input type="text" id="precoPromocional" placeholder="Ex: 4,50">
                </div>
            </div>
            <div class="campo" style="display: flex; gap: 10px;">
                <div style="flex: 1;">
                    <label for="quantidade">Estoque (Qtd):</label>
                    <input type="number" id="quantidade" value="0" min="0">
                </div>
                <div style="flex: 1;">
                    <label for="categoria">Categoria:</label>
                    <select id="categoria">
                        <option value="todos">Todos</option>
                        <option value="tradicionais">Tradicionais</option>
                        <option value="finos">Finos</option>
                    </select>
                </div>
            </div>
            <div class="campo">
                <label for="foto">Foto do Produto:</label>
                <input type="file" id="foto" accept="image/*" required>
            </div>
            <button type="submit">Cadastrar Produto</button>
        </form>

        <h3 style="margin-top: 25px; color: #555;">Produtos Cadastrados</h3>
        <div id="lista-produtos"></div>
    </div>
</div>

<script>
    // DEFINE A SENHA DO ADMINISTRADOR
    const SENHA_CORRETA = "admin123"; 
    let db;

    function verificarSenha() {
        const senhaDigitada = document.getElementById("senha").value;
        if (senhaDigitada === SENHA_CORRETA) {
            document.getElementById("tela-login").style.display = "none";
            document.getElementById("painel-cadastro").style.display = "block";
            inicializarBanco();
        } else {
            document.getElementById("erro-login").style.display = "block";
        }
    }

    // INICIALIZA O BANCO DE DADOS INTERNO DO NAVEGADOR
    function inicializarBanco() {
        const request = indexedDB.open("BancoNativoSaaS", 1);
        request.onupgradeneeded = function(e) {
            db = e.target.result;
            if (!db.objectStoreNames.contains("produtos")) {
                db.createObjectStore("produtos", { keyPath: "id", autoIncrement: true });
            }
        };
        request.onsuccess = function(e) {
            db = e.target.result;
            listarProdutos();
        };
    }

    // CONVERTE A IMAGEM EM TEXTO (BASE64) PARA SALVAR NO BANCO NATIVO
    function salvarProduto(event) {
        event.preventDefault();
        const fotoInput = document.getElementById("foto").files[0];
        const reader = new FileReader();

        reader.onload = function(e) {
            const novoProduto = {
                nome: document.getElementById("nome").value,
                descricao: document.getElementById("descricao").value,
                preco: document.getElementById("preco").value,
                precoPromocional: document.getElementById("precoPromocional").value,
                promocaoQuantidade: parseInt(document.getElementById("quantidade").value) || 0,
                categoria: document.getElementById("categoria").value,
                foto: e.target.result // Guarda a imagem convertida em string
            };

            const transaction = db.transaction(["produtos"], "readwrite");
            const store = transaction.objectStore("produtos");
            store.add(novoProduto);

            transaction.oncomplete = function() {
                document.getElementById("form-produto").reset();
                listarProdutos();
                alert("Produto cadastrado com sucesso!");
            };
        };
        if (fotoInput) reader.readAsDataURL(fotoInput);
    }

    function listarProdutos() {
        const lista = document.getElementById("lista-produtos");
        lista.innerHTML = "";
        const transaction = db.transaction(["produtos"], "readonly");
        const store = transaction.objectStore("produtos");
        
        store.openCursor().onsuccess = function(event) {
            const cursor = event.target.result;
            if (cursor) {
                const p = cursor.value;
                lista.innerHTML += `
                    <div class="produto-item">
                        <span><strong>${p.nome}</strong> - R$ ${p.preco}</span>
                        <button class="btn-deletar" onclick="deletarProduto(${cursor.key})">Excluir</button>
                    </div>`;
                cursor.continue();
            }
        };
    }

    function deletarProduto(id) {
        if (confirm("Tem certeza que deseja excluir este produto?")) {
            const transaction = db.transaction(["produtos"], "readwrite");
            const store = transaction.objectStore("produtos");
            store.delete(id);
            transaction.oncomplete = listarProdutos;
        }
    }
</script>
</body>
</html>

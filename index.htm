<head>

<style>
body{
    margin:0;
    font-family: Arial,sans-serif;
}

/* Cabeçalho estreito e alinhado */ 
header{
    color: white;
    padding: 5px 40px; /* Altura mínima */
	display: flex;
	align-items: center;
	justify-content: space-between;	
    min-height: 60px;
	box-sizing: border-box;
}

/* Controla o tamanho do logo */
header img {
	width: 90px !important;
	height: auto !important;
	display: block;
}

/* Slogan centralizado */
header p {
	margin: 0;
	font-size: 16px;
	font-weight: 500;
	text-align: center;
	flex-grow: 1;
	padding: 0 20px;
}

/* Container do Menu (Alinhado à Direita) */
.menu-container-right {
	display: flex;
	align-items: center;
	gap: 10px; /* Espaço entre a palavra menu e as barras */
	cursor: pointer;
}

/* Palavra Menu escrita */
.menu-text {
	color: #F%F@EB;
	font-size: 16px;
	font-weight: bold;
	font-family: Arial, sans-serif;
}

/* As 3 Barrinhas */
.menu-toggle {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    width: 30px;
    height: 20px;
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 0;
}

/* Desenho das 3 listras */
.menu-toggle span {
    width: 100%;
    height: 3px;
    background-color: #F5F2EB; 
    border-radius: 3px;
    transition: all 0.3s ease;
}

/* Animação das barrinhas virando um 'X' quando aberto */
.menu-toggle.aberto span:nth-child(1) {
    transform: rotate(45deg) translate(4px, 4px);
    background-color: #6b4b2a; 
}
.menu-toggle.aberto span:nth-child(2) {
    opacity: 0;
}
.menu-toggle.aberto span:nth-child(3) {
    transform: rotate(-45deg) translate(5px, -5px);
    background-color: #6b4b2a; 
}

/* Painel Lateral na Direita que desliza (Gaveta) */
.menu-lateral {
    position: fixed;
    top: 0;
    right: -280px; /* Começa escondido fora da tela */
    width: 280px;
    height: 100%;
    background: #F5F2EB; /* Fundo bege pastel */
    box-shadow: -4px 0 15px rgba(0,0,0,0.2); /* Sombra */
    z-index: 2000;
    transition: right 0.4s ease-in-out !important; /* Desliza da direita */
    padding-top: 80px; /* Espaço para não cobrir o botão */
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

/* Quando o menu ganha a classe ativo, ele desliza para dentro */
.menu-lateral.ativo {
    right: 0 !important;
}

/* Título dentro do menu */
.menu-lateral h3 {
    color: #6b4b2a;
    text-align: center;
    margin-bottom: 15px;
    font-size: 18px;
}

/* Estilo dos novos botões de categoria verticais */
.btn-categoria {
    background: transparent;
    color: #6b4b2a;     
    border: none;
    border-left: 4px solid transparent;
    padding: 15px 25px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    text-align: left;
    transition: all 0.3s ease;
}

/* Efeito ao passar o mouse */
.btn-categoria:hover {
    background: rgba(107, 75, 42, 0.1);
    border-left-color: #6b4b2a;
}

/* Botão selecionado/ativo no momento */
.btn-categoria.active {
    background: #6b4b2a;
    color: white;
    border-left-color: #cc9966;
}

/* Fundo escurecido atrás do menu quando aberto */
.menu-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0,0,0,0.4);
    z-index: 1999;
    display: none;
}
.menu-overlay.ativo {
    display: block;
}

/* Tamanho padrão do logo no computador */
.logo-site {
    width: 120px !important;
    height: 120px !important;
    object-fit: contain;
}

/* Seletor para mudar a cor do botão das barrinhas no rolar da página se necessário */
@media (max-width: 768px) {
	 /* Alinha o Logo na esquerda e o botão do Menu no topo direito */
    header {
        padding: 10px 15px !important; /* Diminui a folga em volta */
        display: flex !important;
        align-items: flex-start !important; /* Força o botão do menu e o logo a começarem rigorosamente no topo */
        justify-content: space-between !important;
    }

    /* Ajuste fino no botão do menu para ele colar no topo direito */
    #menuToggle {
        margin-top: 5px !important; /* Pequeno ajuste para alinhar perfeitamente com o topo do logo */
    }

	header img { width: 50px !important; }
	header p { font-size: 11px !important; padding: 0 8px !important; }
    .menu-text { font-size: 14px !important; }

    /* Diminui o logo no celular (de 250px para 120px) para não ocupar a tela toda */
    #logo {
        width: 80px !important;
        height: auto !important; /* Mantém a proporção perfeita sem distorcer a imagem */
    }

    /* Esconde o slogan completamente apenas nos celulares */
    #slogan {
        display: none !important;
    }
}
 
/* Forçando o Grid a funcionar e aplicando o espaçamento obrigatório */
.grid, #grid-produtos {
    display: grid !important;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)) !important; 
	grid-gap: 25px !important;
    gap: 25px !important;
    padding: 25px !important;
    box-sizing: border-box; !important;
    width: 100%; !important;
}
 
/* Garantindo que cada cartão fique isolado */
.card {
    background: #F5F2EB;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 12px 8px rgba(0,0,0,.15);
    margin: 0 !important; 
    box-sizing: border-box;
    width: 100%;
    display: flex;
    flex-direction: column; /* Organiza os itens em pé (foto em cima, infos embaixo) */
}

/* Controla perfeitamente o bloco de informações do doce */
.card .info {
    padding: 15px;
    display: flex;
    flex-direction: column;
    flex-grow: 1; /* Faz este bloco ocupar todo o espaço restante do cartão */
    box-sizing: border-box;
}

/* Força o TÍTULO a começar no topo e reserva um espaço fixo para ele */
.card .info h3 {
    margin: 0 0 6px 0 !important;
    font-size: 18px;
    color: #6b4b2a;
    min-height: 44px; /* Garante espaço para até 2 linhas de título */
    display: flex;
    align-items: flex-start; /* Alinha o texto rigorosamente no topo */
}

/* Garante que a DESCRIÇÃO comece SEMPRE na mesma altura (logo abaixo dos 44px do título) */
.card .info p:not(.price) {
    margin: 0 0 15px 0 !important;
    font-size: 14px;
    color: #555;
    min-height: 60px; /* Reserva espaço para até 3 linhas de descrição */
    overflow: hidden; 
}

/* O SEGREDO DO ALINHAMENTO: Empurra o PREÇO e o BOTÃO sempre para o rodapé do cartão */
.card .info .price {
    margin-top: auto !important; /* Empurra para o fundo do cartão obrigatoriamente */
    margin-bottom: 10px !important;
    font-size: 20px;
    font-weight: bold;
    color: #e61123;
    text-align: center;
}

/* Garante que o botão Adicionar também fique perfeitamente alinhado */
.card .info button {
    margin-top: 0 !important;
    width: 100%;
}
 
/* Impedindo que a foto vaze e cole na do lado */
#grid-produtos .card img {
    display: block; !important;
    width: 100% !important;
    height: 260px !important;
    object-fit: cover !important;
}
 
 /* Controla o tamanho do símbolo do WhatsApp */
.wp-icon-only {

</script>

<script>
    function enviarPedidoDireto() {
        if (typeof sacola === 'undefined' || sacola.length === 0) {
			alert("A sacola está vazia! Adicione produtos para continuar.");
            return;
        }

        var numeroWhats = (window.DadosSite && window.DadosSite.whatsappVendas) ? window.DadosSite.whatsappVendas : "5519999123323";
        var nomeEmpresa = (window.DadosSite && window.DadosSite.nome) ? window.DadosSite.nome : "Sandra Doces Finos";

        var textoPedido = "*Novo Pedido - " + nomeEmpresa + "*\n";
        textoPedido += "-----------------------------------\n\n";
        textoPedido += "Olá! Gostaria de fazer o seguinte pedido:\n\n";

        var totalGeral = 0;

        // Loop tradicional sem travar o Dreamweaver MX
        for (var i = 0; i < sacola.length; i++) {
            var item = sacola[i];
            var subtotal = item.preco * item.quantidade;
            totalGeral += subtotal;
            textoPedido += "▪️ *" + item.quantidade + "x* " + item.nome + "\n";
            textoPedido += " _Subtotal: R$ " + subtotal.toFixed(2).replace('.', ',') + "_\n\n";
        }

        textoPedido += "-----------------------------------\n";
        textoPedido += "💰 *Valor Total: R$ " + totalGeral.toFixed(2).replace('.', ',') + "*\n\n";
        textoPedido += "_Por favor, me informe sobre as opções de entrega/retirada._";

	 // 5. Codifica o texto para o padrão da internet
        var textoCodificado = encodeURIComponent(textoPedido);

        // 6. CORRIGIDO: Formato de link simplificado do WhatsApp (imune a erros de URL)
        var linkWhatsApp = "https://wa.me/" + numeroWhats + "?text=" + textoCodificado;

        console.log("Abrindo link corrigido: " + linkWhatsApp);

        // BAIXA AUTOMÁTICA NAS PROMOÇÕES POR QUANTIDADE
        for (var i = 0; i < sacola.length; i++) {
            var itemSacola = sacola[i];
            // Procura o doce correspondente na lista do produtos.js
            var prodOriginal = produtos.find(function(p) { return p.nome === itemSacola.nome; });
            if (prodOriginal && prodOriginal.promocaoQuantidade > 0) {
                // Diminui a quantidade vendida
                prodOriginal.promocaoQuantidade -= itemSacola.quantidade;
                if (prodOriginal.promocaoQuantidade < 0) prodOriginal.promocaoQuantidade = 0;
            }
        }
        
        // Atualiza a tela do site com os novos estoques promocionais
        renderizarProdutos();

		window.open(linkWhatsApp, '_blank');
    }
</script>
